services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-comparia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-comparia}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-comparia}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    restart: unless-stopped
    volumes:
      - redis-data:/data

  backend:
    build:
      context: ../..
      dockerfile: devops/docker/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      COMPARIA_DB_URI: postgresql://${POSTGRES_USER:-comparia}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-comparia}
      COMPARIA_REDIS_HOST: redis
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ALBERT_KEY: ${ALBERT_KEY:-}
      ALTCHA_HMAC_KEY: ${ALTCHA_HMAC_KEY:-}
      CACHE_ENABLED: ${CACHE_ENABLED:-true}
      CACHE_PROBABILITY: ${CACHE_PROBABILITY:-0.75}
      CACHE_TTL: ${CACHE_TTL:-172800}
      CACHE_MAX_RESPONSES: ${CACHE_MAX_RESPONSES:-5}
      LOG_FORMAT: JSON
      LOGDIR: /data
    # Apply pending Alembic migrations on startup so a fresh database (empty
    # volume) is provisioned automatically, then serve the app. Idempotent.
    entrypoint: ["sh", "-c"]
    command:
      - |
        uv run alembic upgrade head
        exec uv run uvicorn backend.main:app --host 0.0.0.0 --port 80
    ports:
      - "8008:80"        # backend accessible sur http://MAC:8008

  ranking-cron:
    build:
      context: ../..
      dockerfile: devops/docker/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      COMPARIA_DB_URI: postgresql://${POSTGRES_USER:-comparia}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-comparia}
      COMPARIA_REDIS_HOST: redis
      LOG_FORMAT: JSON
    # Recompute Bradley-Terry rankings hourly and store in Redis (24h TTL).
    entrypoint: ["sh", "-c"]
    command:
      - |
        while true; do
          uv run python -m utils.ranking.run || echo "ranking run failed"
          sleep 3600
        done

  frontend:
    build:
      context: ../../frontend
      dockerfile: ../devops/docker/Dockerfile.front
      args:
        PUBLIC_API_URL: ${PUBLIC_URL}
        MATOMO_ID: ${MATOMO_ID:-}
        MATOMO_URL: ${MATOMO_URL:-}
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      PORT: 3000
      PUBLIC_API_URL: ${PUBLIC_URL}
      PUBLIC_API_LOCAL_URL: http://backend:80
    ports:
      - "3000:3000"      # frontend accessible sur http://MAC:3000


